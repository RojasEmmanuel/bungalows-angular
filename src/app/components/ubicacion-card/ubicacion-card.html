<article class="card">
  <header class="card__media">
    @if (showAvatar()) {
      <div class="card__avatar">
        <span class="card__avatar-text">{{ iniciales() }}</span>
      </div>
    } @else {
      <img
        class="card__img"
        [src]="ubicacion().imagenPath"
        [alt]="ubicacion().nombre"
        (error)="onImageError()"
      />
    }

    <span class="card__slug">{{ ubicacion().slug }}</span>

    <button
      type="button"
      class="card__edit"
      (click)="onEditar()"
      aria-label="Editar ubicación"
      title="Editar ubicación"
    >
      <svg
        class="card__edit-icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M12 20h9" />
        <path d="M16.5 3.5a2.121 2.121 0 1 1 3 3L7 19l-4 1 1-4 12.5-12.5z" />
      </svg>
    </button>
  </header>

  <div class="card__body">
    <h3 class="card__title">{{ ubicacion().nombre }}</h3>
    <p class="card__address">{{ ubicacion().direccion }}</p>

    <dl class="card__stats">
      <div class="stat">
        <dt class="stat__label">Colaboradores</dt>
        <dd class="stat__value">{{ ubicacion().totalColaboradores }}</dd>
      </div>
      <div class="stat">
        <dt class="stat__label">Activos</dt>
        <dd class="stat__value stat__value--brand">
          {{ ubicacion().colaboradoresActivos }}
        </dd>
      </div>
    </dl>
  </div>
</article>
