<form class="form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  @if (errorGeneral()) {
    <div class="banner">{{ errorGeneral() }}</div>
  }

  <div class="field">
    <label class="field__label" for="p-nombre">Nombre</label>
    <input
      id="p-nombre"
      class="field__input"
      type="text"
      formControlName="nombre"
      placeholder="Ej. Cajero"
      autocomplete="off"
      [disabled]="guardando()"
    />
    @if (errorDe('nombre'); as msg) {
      <p class="field__error">{{ msg }}</p>
    }
  </div>

  <div class="field">
    <label class="field__label" for="p-descripcion">Descripción</label>
    <textarea
      id="p-descripcion"
      class="field__input field__input--area"
      formControlName="descripcion"
      placeholder="Describe las funciones del puesto"
      rows="3"
      [disabled]="guardando()"
    ></textarea>
    @if (errorDe('descripcion'); as msg) {
      <p class="field__error">{{ msg }}</p>
    }
  </div>

  <div class="actions">
    <button
      type="button"
      class="btn btn--ghost"
      (click)="cancelar()"
      [disabled]="guardando()"
    >
      Cancelar
    </button>
    <button
      type="submit"
      class="btn btn--primary"
      [disabled]="guardando()"
    >
      @if (guardando()) { Guardando… } @else { Crear puesto }
    </button>
  </div>
</form>
