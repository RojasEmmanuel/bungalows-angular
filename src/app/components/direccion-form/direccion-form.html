@if (cargando()) {
  <p class="state">Cargando dirección actual…</p>
} @else {
  <form class="form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    @if (errorGeneral()) {
      <div class="banner">{{ errorGeneral() }}</div>
    }

    <div class="field">
      <label class="field__label" for="d-calle">Calle</label>
      <input
        id="d-calle"
        class="field__input"
        type="text"
        formControlName="calle"
        placeholder="Ej. Av. del Mar"
        autocomplete="off"
        [disabled]="guardando()"
      />
      @if (errorDe('calle'); as msg) {
        <p class="field__error">{{ msg }}</p>
      }
    </div>

    <div class="field">
      <label class="field__label" for="d-colonia">Colonia</label>
      <input
        id="d-colonia"
        class="field__input"
        type="text"
        formControlName="colonia"
        placeholder="Ej. Centro"
        autocomplete="off"
        [disabled]="guardando()"
      />
      @if (errorDe('colonia'); as msg) {
        <p class="field__error">{{ msg }}</p>
      }
    </div>

    <div class="grid">
      <div class="field">
        <label class="field__label" for="d-ciudad">Ciudad</label>
        <input
          id="d-ciudad"
          class="field__input"
          type="text"
          formControlName="ciudad"
          placeholder="Ej. Oaxaca"
          autocomplete="off"
          [disabled]="guardando()"
        />
        @if (errorDe('ciudad'); as msg) {
          <p class="field__error">{{ msg }}</p>
        }
      </div>

      <div class="field">
        <label class="field__label" for="d-estado">Estado</label>
        <select
          id="d-estado"
          class="field__input"
          formControlName="estado"
          [disabled]="guardando()"
        >
          @for (e of estados(); track e.value) {
            <option [ngValue]="e.value">{{ e.label }}</option>
          }
        </select>
      </div>

      <div class="field">
        <label class="field__label" for="d-cp">Código postal</label>
        <input
          id="d-cp"
          class="field__input"
          type="text"
          inputmode="numeric"
          formControlName="cp"
          placeholder="Ej. 68000"
          maxlength="5"
          autocomplete="off"
          [disabled]="guardando()"
        />
        @if (errorDe('cp'); as msg) {
          <p class="field__error">{{ msg }}</p>
        }
      </div>
    </div>

    <div class="actions">
      <button
        type="button"
        class="btn btn--ghost"
        (click)="cancelar()"
        [disabled]="guardando()"
      >
        Cancelar
      </button>
      <button
        type="submit"
        class="btn btn--primary"
        [disabled]="guardando()"
      >
        @if (guardando()) { Guardando… } @else { Guardar dirección }
      </button>
    </div>
  </form>
}
