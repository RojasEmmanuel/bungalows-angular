<section class="page">
  <header class="page__head">
    <div>
      <h1 class="page__title">Préstamos</h1>
      <p class="page__subtitle">Administra los préstamos otorgados a los colaboradores.</p>
    </div>

    <button type="button" class="btn-new" (click)="abrirModalCrear()">
      + Nuevo préstamo
    </button>
  </header>

  <app-prestamos-table
    (editar)="onEditarPrestamo($event)"
    (eliminar)="onEliminarPrestamo($event)"
  />
</section>

<!-- Modal: Nuevo préstamo -->
<app-modal
  titulo="Nuevo préstamo"
  [abierto]="modalCrearAbierto()"
  (cerrar)="cerrarModalCrear()"
>
  <app-prestamos-form
    (creado)="onPrestamoCreado($event)"
    (cancelado)="cerrarModalCrear()"
  />
</app-modal>

<!-- Modal: Editar préstamo -->
<app-modal
  titulo="Editar préstamo"
  [abierto]="modalEditarAbierto()"
  (cerrar)="cerrarModalEditar()"
>
  @if (prestamoSeleccionadoId(); as id) {
    <app-prestamos-edit
      [prestamoId]="id"
      (guardado)="onPrestamoActualizado($event)"
      (cancelado)="cerrarModalEditar()"
    />
  }
</app-modal>

<!-- Modal: Eliminar préstamo -->
<app-confirm-modal
  titulo="Eliminar préstamo"
  mensaje="¿Seguro que deseas eliminar este préstamo? Esta acción no se puede deshacer."
  [detalle]="prestamoAEliminar()?.nombreColaborador ?? null"
  textoConfirmar="Eliminar"
  [abierto]="modalEliminarAbierto()"
  [procesando]="eliminando()"
  (confirmar)="confirmarEliminar()"
  (cancelar)="cerrarModalEliminar()"
/>
