<section class="dashboard">
  <!-- Columna ancha: ubicaciones -->
  <div class="dashboard__main">

    <!-- ===== Header ===== -->
    <!-- Solo se muestra si hay datos o está cargando -->
    @if (loadingUbicaciones() || ubicaciones().length > 0) {
      <header class="section-head">
        <h2 class="section-head__title">Ubicaciones</h2>

        <div class="section-head__actions">
          <button
            type="button"
            class="btn-new btn-new--ghost"
            (click)="abrirModalPuesto()"
          >
            Nuevo puesto
          </button>
          <button
            type="button"
            class="btn-new"
            (click)="abrirModalUbicacion()"
          >
            Nueva
          </button>
        </div>
      </header>
    }

    <!-- ===== Estados ===== -->
    @if (loadingUbicaciones()) {
      <p class="state">Cargando ubicaciones…</p>
    }

    <!-- ===== Sin ubicaciones: empty extendido ===== -->
    @else if (ubicaciones().length === 0) {
      <app-empty-state
        image="ubicaciones_empty.svg"
        title="Sin ubicaciones registradas"
        description="Aún no has registrado ninguna ubicación. Agrega la primera para poder asignar colaboradores y puestos."
        actionLabel="Nueva ubicación"
        (action)="abrirModalUbicacion()"
      />
    }

    <!-- ===== Con datos: grid ===== -->
    @else {
      <div class="grid">
        @for (u of ubicaciones(); track u.id) {
          <app-ubicacion-card
            [ubicacion]="u"
            (editar)="abrirModalEditarUbicacion($event)"
          />
        }
      </div>
    }
  </div>

  <aside class="dashboard__aside">
    <app-aniversarios-widget />
    <app-empresa-list
      (crear)="abrirModalEmpresa()"
      (editar)="onEmpresaEditar($event)"
    />
  </aside>
</section>


<!-- ============ Modales ============ -->

<app-modal
  titulo="Nueva ubicación"
  [abierto]="modalUbicacionAbierto()"
  (cerrar)="cerrarModalUbicacion()"
>
  <app-ubicacion-form
    (creada)="onUbicacionCreada($event)"
    (cancelada)="cerrarModalUbicacion()"
  />
</app-modal>

<app-modal
  titulo="Nuevo puesto"
  [abierto]="modalPuestoAbierto()"
  (cerrar)="cerrarModalPuesto()"
>
  <app-puesto-form
    (creado)="onPuestoCreado($event)"
    (cancelado)="cerrarModalPuesto()"
  />
</app-modal>

<app-modal
  titulo="Editar ubicación"
  [abierto]="modalUbicacionPatchAbierto()"
  (cerrar)="cerrarModalEditarUbicacion()"
>
  @if (ubicacionSeleccionadaId(); as id) {
    <app-ubicacion-patch
      [ubicacionId]="id"
      (guardado)="onUbicacionActualizada($event)"
      (cancelado)="cerrarModalEditarUbicacion()"
    />
  }
</app-modal>

<app-modal
  titulo="Nueva empresa"
  [abierto]="modalEmpresaAbierto()"
  (cerrar)="cerrarModalEmpresa()"
>
  <app-empresa-form
    (creada)="onEmpresaCreada()"
    (cancelada)="cerrarModalEmpresa()"
  />
</app-modal>

<app-modal
  titulo="Editar empresa"
  [abierto]="modalEmpresaEditAbierto()"
  (cerrar)="cerrarModalEmpresaEdit()"
>
  @if (empresaEditId(); as id) {
    <app-empresa-edit
      [empresaId]="id"
      (guardado)="onEmpresaActualizada()"
      (cancelado)="cerrarModalEmpresaEdit()"
    />
  }
</app-modal>
