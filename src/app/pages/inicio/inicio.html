<section class="dashboard">
  <!-- Columna ancha: ubicaciones -->
  <div class="dashboard__main">
    <header class="section-head">
      <h2 class="section-head__title">Ubicaciones</h2>

      <div class="section-head__actions">
        <button
          type="button"
          class="btn-new btn-new--ghost"
          (click)="abrirModalPuesto()"
        >
          Nuevo puesto
        </button>
        <button
          type="button"
          class="btn-new"
          (click)="abrirModalUbicacion()"
        >
          Nueva
        </button>
      </div>
    </header>

    @if (loadingUbicaciones()) {
      <p class="state">Cargando ubicaciones…</p>
    } @else if (ubicaciones().length === 0) {
      <p class="state">No hay ubicaciones registradas.</p>
    } @else {
      <div class="grid">
        @for (u of ubicaciones(); track u.id) {
        <app-ubicacion-card
          [ubicacion]="u"
          (editar)="abrirModalEditarUbicacion($event)"
        />
}
      </div>
    }
  </div>

  <aside class="dashboard__aside">
    <app-aniversarios-widget />
  </aside>
</section>

<app-modal
  titulo="Nueva ubicación"
  [abierto]="modalUbicacionAbierto()"
  (cerrar)="cerrarModalUbicacion()"
>
  <app-ubicacion-form
    (creada)="onUbicacionCreada($event)"
    (cancelada)="cerrarModalUbicacion()"
  />
</app-modal>

<app-modal
  titulo="Nuevo puesto"
  [abierto]="modalPuestoAbierto()"
  (cerrar)="cerrarModalPuesto()"
>
  <app-puesto-form
    (creado)="onPuestoCreado($event)"
    (cancelado)="cerrarModalPuesto()"
  />
</app-modal>


<app-modal
  titulo="Editar ubicación"
  [abierto]="modalUbicacionPatchAbierto()"
  (cerrar)="cerrarModalEditarUbicacion()"
>
  @if (ubicacionSeleccionadaId(); as id) {
    <app-ubicacion-patch
      [ubicacionId]="id"
      (guardado)="onUbicacionActualizada($event)"
      (cancelado)="cerrarModalEditarUbicacion()"
    />
  }
</app-modal>
